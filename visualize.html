<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visualize a sentence</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#0d1117; color:#e6edf3; }
header { padding:12px 16px; background:#161b22; border-bottom:1px solid #30363d; }
a { color:#58a6ff; text-decoration:none; }
.wrap { display:flex; min-height:calc(100vh - 48px); }
aside { width:300px; padding:16px; background:#161b22; border-right:1px solid #30363d; }
textarea { width:100%; height:120px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:8px; }
button { margin-top:10px; width:100%; padding:10px; background:#238636; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:bold; }
main { padding:16px; flex:1; }
canvas { background:#0d1117; border:1px solid #30363d; border-radius:8px; max-width:100%; }
</style>
</head>
<body>
<header>
  <a href="index.html">Home</a> &nbsp; | &nbsp; Visualization
</header>
<div class="wrap">
<aside>
  <p>Type any sentence</p>
  <textarea id="thought">the ball moves across the room</textarea>
  <button id="go">Visualize</button>
  <p style="color:#8b949e;font-size:13px;">Any sentence will appear and move. Words like ball, red, green, slow, fast change the picture.</p>
</aside>
<main>
<canvas id="stage" width="860" height="440"></canvas>
</main>
</div>
<script>
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var sentence = 'the ball moves across the room';
var words = [];
var ball = { on:true, x:80, y:220, vx:3, vy:1.5, r:18, color:'#58a6ff' };

function makeWords(text) {
  sentence = (text || '').trim() || 'write a sentence';
  var parts = sentence.split(/\s+/);
  words = [];
  var i;
  for (i = 0; i < parts.length; i++) {
    words.push({
      text: parts[i],
      x: 40 + i * 28,
      y: 80 + (i % 5) * 18,
      vx: 0.8 + (i % 3) * 0.3,
      vy: 0.4 + (i % 2) * 0.3
    });
  }
  var t = sentence.toLowerCase();
  ball.on = t.indexOf('ball') >= 0;
  ball.color = t.indexOf('red') >= 0 ? '#f85149' : t.indexOf('green') >= 0 ? '#3fb950' : '#58a6ff';
  var sx = ball.vx >= 0 ? 1 : -1;
  var sy = ball.vy >= 0 ? 1 : -1;
  if (t.indexOf('slow') >= 0) { ball.vx = sx * 1.2; ball.vy = sy * 0.8; }
  else if (t.indexOf('fast') >= 0) { ball.vx = sx * 6; ball.vy = sy * 3; }
  else { ball.vx = sx * 3; ball.vy = sy * 1.5; }
  ball.x = 80;
  ball.y = 220;
}

function bounce(obj, w, h, size) {
  obj.x += obj.vx;
  obj.y += obj.vy;
  if (obj.x < size) { obj.x = size; obj.vx = Math.abs(obj.vx); }
  if (obj.x > w - size) { obj.x = w - size; obj.vx = -Math.abs(obj.vx); }
  if (obj.y < size) { obj.y = size; obj.vy = Math.abs(obj.vy); }
  if (obj.y > h - size) { obj.y = h - size; obj.vy = -Math.abs(obj.vy); }
}

function step() {
  var i;
  for (i = 0; i < words.length; i++) bounce(words[i], canvas.width, canvas.height, 20);
  if (ball.on) bounce(ball, canvas.width, canvas.height, ball.r);
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#21262d';
  var i;
  for (i = 0; i < canvas.width; i += 40) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
  }
  for (i = 0; i < canvas.height; i += 40) {
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
  }
  ctx.fillStyle = '#8b949e';
  ctx.font = '16px Arial';
  ctx.fillText(sentence, 20, 28);
  ctx.font = '22px Arial';
  ctx.fillStyle = '#58a6ff';
  for (i = 0; i < words.length; i++) {
    ctx.fillText(words[i].text, words[i].x, words[i].y);
  }
  if (ball.on) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = ball.color;
    ctx.fill();
  }
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = function() {
  makeWords(document.getElementById('thought').value);
};

makeWords(document.getElementById('thought').value);
loop();
</script>
</body>
</html>
