<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Lumina</title>
<style>
  :root {
    --bg: #f6f3ee;
    --ink: #161513;
    --muted: #6b6560;
    --line: #ddd6cc;
    --card: #fffdf9;
    --accent: #1f4d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 6vw;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    font-family: Arial, sans-serif;
    letter-spacing: .18em;
    font-size: 12px;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
  }
  nav a {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--ink);
    text-decoration: none;
  }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: calc(100vh - 63px);
  }
  aside {
    padding: 32px 28px;
    border-right: 1px solid var(--line);
    background: #f1eee8;
  }
  h1 { font-weight: 400; font-size: 34px; margin: 0 0 10px; }
  .sub { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  label {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    height: 140px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 14px;
    font: 16px/1.45 Georgia, serif;
    resize: vertical;
  }
  button {
    margin-top: 14px;
    width: 100%;
    border: 0;
    background: var(--accent);
    color: #f6f3ee;
    padding: 13px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .04em;
    cursor: pointer;
  }
  main { padding: 32px 36px 50px; }
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 22px;
    margin-bottom: 16px;
  }
  .kicker {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #written { font-size: 26px; line-height: 1.3; }
  img { width: 100%; display: block; background: #ece7df; min-height: 280px; }
  .status {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<nav>
  <a class="mark" href="index.html">Lumina</a>
  <a href="index.html">Home</a>
</nav>
<div class="layout">
  <aside>
    <h1>Studio</h1>
    <p class="sub">Write one complete sentence. The words stay on the page, then they are converted into an image.</p>
    <label for="thought">Sentence</label>
    <textarea id="thought">A red ball rolling across a wooden table in morning light</textarea>
    <button id="go">Convert sentence to image</button>
  </aside>
  <main>
    <div class="block">
      <div class="kicker">The sentence, written</div>
      <div id="written">A red ball rolling across a wooden table in morning light</div>
    </div>
    <div class="block">
      <div class="kicker">The sentence, converted</div>
      <img id="art" alt="Generated visualization">
      <div class="status" id="status">Press convert to create the image.</div>
    </div>
  </main>
</div>
<script>
function convert() {
  var text = document.getElementById('thought').value.replace(/^\s+|\s+$/g, '');
  if (!text) text = 'an empty room with soft light';
  document.getElementById('written').innerText = text;
  document.getElementById('status').innerText = 'Converting the written sentence into an image...';
  var prompt = 'refined educational illustration, realistic lighting, no text overlay, scene: ' + text;
  var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?nologo=true&width=1024&height=640&seed=' + Date.now();
  var img = document.getElementById('art');
  img.onload = function() {
    document.getElementById('status').innerText = 'Conversion complete.';
  };
  img.onerror = function() {
    document.getElementById('status').innerText = 'The image did not load. Check your internet connection.';
  };
  img.src = url;
}
document.getElementById('go').onclick = convert;
</script>
</body>
</html>
